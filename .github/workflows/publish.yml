name: Test and deploy dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # this action publishes exact tags only, no "v10"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Renders from committed case study outputs only; raw data is never fetched here.
      - run: uv run quarto render dashboard
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
