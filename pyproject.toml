[project]
name = "brunei-analytics"
version = "0.1.0"
description = "Case studies and dashboards on Brunei public data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "ipykernel",
    "jupyter-client",
    "nbclient",
    "nbformat",
    "openpyxl",
    "pandas",
    "pandera",
    "plotly",
    "pyyaml",
    "requests",
    "wbgapi",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
