# Weekly update proposals for workflow actions (pinned to SHAs) and Python packages (uv.lock).
# DATA_USE_POLICY.md §8. Dependabot PRs are the only PRs this repo expects (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
