# Where the glossary's definitions come from (DATA_USE_POLICY.md §7, "Glossary sources").
# Definitions only: no numbers from these are used anywhere on the site. Each entry was opened
# and checked on its access date (17 Oct 2026); definitions in glossary.yml are our paraphrase.
#
# Two forms:
#   - a document (kind: official | book | journal), same fields as context.yml;
#   - a dataset already used in a case study (kind: dataset, page_url): its credit and APA
#     reference come from that study's outputs/*.meta.json, so it is never typed twice.

# Brunei publishers' own definitions (first choice: they match how the data was measured)
