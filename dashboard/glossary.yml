# Glossary for the site (DESIGN.md §5, "Glossary terms"). Each entry:
#   key: used on pages as [shown text]{.term term="key"}
#   term: the name shown in the pop-up and on the Glossary page
#   definition: one or two plain sentences
#   compare: keys of terms that are easy to confuse with this one; their definitions are shown
#            beside it in the pop-up ("Not the same as")
#   basis: where the definition comes from (agreed 17 Oct 2026):
#            standard  - an official or statistical definition (Brunei publisher first, then
#                        UN, FAO, ILO, IMF, OECD or a statistics reference; definitions only)
#            publisher - the term as the data's publisher uses it in its tables
#            site      - a measure defined for these case studies (no outside source)
#   sources: keys in glossary_sources.yml (required for standard and publisher). Definitions
#            are our own words; check the source says the same before citing it.
# Keep definitions neutral and true for every case study that uses the term.

- key: share-of-businesses
  basis: site
  term: Share of businesses
  definition: >
    The percentage of all businesses that are in a group (a product category or a district).
    It counts businesses, whatever their size, so it says nothing about how much they sell.
  compare: [share-of-market-value, share-of-employees]

- key: share-of-employees
  basis: site
  term: Share of employees
  definition: >
    The percentage of all people employed in the industry who work in a group, such as a
    district.
  compare: [share-of-businesses, share-of-market-value]

- key: share-of-market-value
  basis: site
  term: Share of market value
  definition: >
    The percentage of the industry's total market value that comes from a group. A few large
    businesses can have a big share of the value even if they are a small share of businesses.
  compare: [share-of-businesses, share-of-employees]

- key: market-value
  basis: publisher
  sources: [dataset-agrimakanan-status, dataset-agrimakanan-industry]
  term: Market value
  definition: >
    The value of the products made, in Brunei dollars, as reported by the publisher. It is not
    profit, and it is not adjusted for inflation.
  compare: [current-prices]

- key: current-prices
  basis: standard
  sources: [ilo-cpi-manual, deps-cpi-notes]
  term: Current prices
  definition: >
    Values at the prices of each year, not adjusted for inflation. A rise in value can come
    from higher prices as well as from larger quantities.
  compare: [market-value]

- key: continued-item
  basis: site
  term: Continued item
  definition: >
    An item (such as a product category) that appears in both the first and the last year
    being compared, so the two years can be compared like for like. Shown in solid colour.
  compare: [new-item, discontinued-item]

- key: new-item
  basis: site
  term: New item
  definition: >
    An item that appears in the later year but not the earlier one, often because the
    publisher started counting it. Its value is not growth of the items that were already
    counted. Shown with diagonal stripes.
  compare: [continued-item, discontinued-item]

- key: discontinued-item
  basis: site
  term: Discontinued item
  definition: >
    An item that appears in the earlier year but not the later one, because it stopped being
    counted or was renamed or replaced. Shown as an outline only.
  compare: [continued-item, new-item]

- key: livestock-based
  basis: publisher
  sources: [dataset-agrimakanan-status, dataset-agrimakanan-categories]
  term: Livestock-based products
  definition: >
    The Ministry of Industry and Primary Resources' group for processed foods made from
    animals: meat products, and from 2013 fast or instant food.
  compare: [crop-based]

- key: crop-based
  basis: publisher
  sources: [dataset-agrimakanan-status, dataset-agrimakanan-categories]
  term: Crop-based products
  definition: >
    The Ministry of Industry and Primary Resources' group for all other processed foods, such
    as bakery, drinks, snacks and spices. It also includes fish products.
  compare: [livestock-based]

- key: median
  basis: standard
  sources: [nist-handbook]
  term: Median (typical year)
  definition: >
    The middle value when the years are put in order: half the years are above it and half
    below. Unlike the average, one extreme year barely moves it.
  compare: [average]

- key: average
  basis: standard
  sources: [nist-handbook]
  term: Average (mean)
  definition: >
    The total divided by the number of years. One very high or low year can pull it a long way.
  compare: [median, three-year-average]

- key: three-year-average
  basis: site
  term: Three-year average
  definition: >
    The average of three consecutive years. It smooths out single-year swings, which matter
    when the numbers are small.
  compare: [average]

- key: correlation
  basis: standard
  sources: [openstax-stats]
  term: Correlation
  definition: >
    A number from −1 to 1 showing how closely two measures rise and fall together along a
    straight line. 1 means they move perfectly together, −1 perfectly opposite, and 0 no
    straight-line link. It doesn't show that one causes the other.

- key: per-100-accidents
  basis: site
  term: Per 100 accidents
  definition: >
    A count divided by the number of accidents, times 100. It shows how many people were
    affected for every 100 accidents, so years with more or fewer accidents can be compared.

- key: solved-case
  basis: publisher
  sources: [dataset-crime-2013]
  term: Solved case (as published)
  definition: >
    A case the source records as solved. The source doesn't define the term or say when a case
    was counted as solved, so the figures are shown as published.

- key: cpi
  basis: standard
  sources: [deps-cpi-notes]
  term: Consumer price index (CPI)
  definition: >
    A measure of the average change over time in the prices households pay for a fixed basket
    of goods and services. A rise means prices went up on average. It measures prices, not the
    full cost of living.
  compare: [index-rebased]

- key: index-rebased
  basis: standard
  sources: [ilo-cpi-manual]
  term: Index (2019 = 100)
  definition: >
    Values rescaled so that 2019 equals 100. A value of 107 means 7% above 2019. It changes the
    starting point, not the pattern.
  compare: [cpi]

- key: local-share-of-supply
  basis: site
  term: Local share of supply
  definition: >
    Local production divided by local production plus imports. It shows how much of what
    reached the market was produced in Brunei. It can't go above 100%.
  compare: [self-sufficiency-ratio]

- key: self-sufficiency-ratio
  basis: standard
  sources: [fao-fbs]
  term: Self-sufficiency ratio
  definition: >
    Local production divided by what the country uses: production plus imports, minus exports.
    It can go above 100% when a country produces more than it uses.
  compare: [local-share-of-supply]

- key: day-old-chick
  basis: publisher
  sources: [dataset-day-old-chicks]
  term: Day-old chick
  definition: >
    A chick on the day it hatches. The Agriculture and Agrifood Department's tables count
    day-old chicks hatched in Brunei (local production) and imported.
  compare: [hatching-egg]

- key: hatching-egg
  basis: publisher
  sources: [dataset-fertilized-eggs, fao-agrovoc-broiler-breeders]
  term: Fertilized (hatching) egg
  definition: >
    A fertile egg laid by breeding hens (parent stock) to be hatched into a chick for broiler
    (meat chicken) production, not sold for eating.
  compare: [day-old-chick]

- key: balance-of-trade
  basis: standard
  sources: [deps-imts-faq]
  term: Balance of trade
  definition: >
    The value of a country's exports minus the value of its imports in a year. Positive means
    a surplus (more sold abroad than bought), negative a deficit. It covers goods only, not
    services.
  compare: [total-trade]

- key: total-trade
  basis: standard
  sources: [deps-imts-faq]
  term: Total trade
  definition: >
    The value of exports plus the value of imports: how much trade there was in both
    directions, not whether more was sold or bought.
  compare: [balance-of-trade]

- key: domestic-exports
  basis: standard
  sources: [deps-imts-faq]
  term: Domestic exports
  definition: >
    Goods grown, produced, manufactured, assembled or processed in the country and then
    exported.
  compare: [re-exports]

- key: re-exports
  basis: standard
  sources: [deps-imts-faq]
  term: Re-exports
  definition: >
    Goods that were imported and then exported again without being changed in the country.
    They count in exports, but they were not made there.
  compare: [domestic-exports]

- key: commodity-section
  basis: standard
  sources: [un-sitc4, deps-imts-faq]
  term: Commodity section (SITC)
  definition: >
    One of the ten broad groups of goods in the United Nations' Standard International Trade
    Classification (SITC), numbered 0 to 9, e.g. 3 for mineral fuels and 7 for machinery and
    transport equipment. Each section mixes many products. Brunei's tables used Revision 3 to
    2012 and Revision 4 from 2013, which keeps the same ten sections.

- key: share-of-imports
  basis: site
  term: Share of imports (or exports)
  definition: >
    A section's value as a percentage of that year's total imports (or exports). A share can
    fall while the value rises, if other sections grow faster.
  compare: [current-prices]

- key: teu
  basis: publisher
  sources: [dataset-muara-containers]
  term: TEU (twenty-foot equivalent unit)
  definition: >
    The standard way to count containers by size: a 20-foot container counts as 1 TEU and a
    40-foot container as 2. A year's TEU total is not the number of containers.

- key: local-containers
  basis: publisher
  sources: [dataset-muara-containers]
  term: Local containers
  definition: >
    Containers brought into Brunei or sent out of Brunei through Muara Port, counted in TEU.
  compare: [transhipment-containers]

- key: transhipment-containers
  basis: publisher
  sources: [dataset-muara-containers]
  term: Transhipment containers
  definition: >
    Containers only passing through (transiting at) Muara Container Terminal, not bound for or
    from Brunei. Counted in TEU.
  compare: [local-containers]

- key: uncontainerised-cargo
  basis: publisher
  sources: [dataset-muara-conventional]
  term: Uncontainerised (loose) cargo
  definition: >
    Cargo not packed in containers, such as steel, pipes, vehicles, livestock and cement,
    handled at Muara Conventional Terminal and counted by weight in tonnes.
  compare: [teu]

- key: average-retail-price
  basis: publisher
  sources: [dataset-retail-food, dataset-retail-nonfood]
  term: Average retail price (as published)
  definition: >
    The price the source gives for an item in a year, in Brunei dollars. The tables don't say
    how many shops, brands or months each average covers, so the prices are shown as published.

- key: set-price
  basis: site
  term: Government-set price
  definition: >
    A tariff or fee fixed by the Government, such as an electricity or water charge or a
    passport fee, rather than a price set by shops. The source tables don't label these; the
    case study marks them.
  compare: [average-retail-price]
